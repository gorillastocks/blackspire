name: Deploy web build to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: cloudflare-pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 19435118559b660e1948beac80fe0aff
    steps:
      - name: Check for Cloudflare token
        id: tok
        run: if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo ok=1 >> "$GITHUB_OUTPUT"; else echo "::warning::CLOUDFLARE_API_TOKEN secret not set; skipping deploy"; fi
      - uses: actions/checkout@v4
        if: steps.tok.outputs.ok == '1'
      - uses: actions/setup-node@v4
        if: steps.tok.outputs.ok == '1'
        with: { node-version: 22, cache: npm }
      - name: Build (full game + info pages)
        if: steps.tok.outputs.ok == '1'
        run: |
          npm ci
          npm run build
          cp site-cf/privacy.html site-cf/support.html site-cf/attribution.html dist/
      - name: Deploy to Pages project blackspire
        if: steps.tok.outputs.ok == '1'
        run: npx --yes wrangler@4 pages deploy dist --project-name=blackspire --branch=main --commit-hash="$GITHUB_SHA" --commit-message="${GITHUB_SHA::7}"
